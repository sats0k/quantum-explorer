# PhoenixCoin explorer reverse proxy
# Put in /etc/nginx/sites-available/explorer (or sites-enabled) and:
#   ln -s /etc/nginx/sites-available/explorer /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The Python web server runs dual-stack on 127.0.0.1:8080 (see server.py).

server {
    listen 80;
    listen [::]:80;

    server_name _;  # or explorer.example.com

    client_max_body_size 1m;
    access_log /var/log/nginx/explorer_access.log;
    error_log  /var/log/nginx/explorer_error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}

