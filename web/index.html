<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoenixCoin Quantum Explorer</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; }
  header { background: #222; color: #fff; padding: 12px 20px;
           display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header input[type=text] { flex: 1; max-width: 520px; padding: 7px 10px;
           border-radius: 4px; border: none; font: inherit; }
  header span#tip { font-size: 13px; color: #9fd; }
  main { max-width: 980px; margin: 20px auto; padding: 0 16px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #eee;
           font-size: 13px; word-break: break-all; }
  th { background: #eee; }
  a { color: #06c; text-decoration: none; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  .card { background: #fff; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  .hl0 { color: #c00; }   /* spent */
  .hl1 { color: #080; }   /* received */
  h2 { font-size: 16px; margin-top: 0; }
  .badge { background:#26a; color:#fff; padding:1px 7px; border-radius:10px;
           font-size:11px; }
  .badge.hybrid { background:#286; }
  .badge.spent { background:#c00; }
  footer { text-align: center; color: #888; font-size: 12px; padding: 24px; }
  /* Font Awesome fa-github glyph, inlined so the page needs no CDN. Fixed
     bottom-left, out of the footer's flow. */
  .repo { position: fixed; left: 14px; bottom: 10px; color: #888;
          opacity: .65; z-index: 10; line-height: 0; }
  .repo:hover { opacity: 1; color: #06c; }
</style>
</head>
<body>
<header>
  <h1><a href="#" data-home style="color:inherit;text-decoration:none">PhoenixCoin Quantum</a></h1>
  <input id="q" type="text" placeholder="block height or hash, txid, or address..."
         autocomplete="off">
  <span id="tip"></span>
</header>
<main id="main"><div class="card">loading…</div></main>
<footer>explorer backend: Python + SQLite (hybrid-aware via daemon RPC)</footer>
<a class="repo" href="https://github.com/sats0k/quantum-explorer" title="Source code"
   aria-label="Source code" target="_blank" rel="noopener">
  <svg viewBox="0 0 496 512" width="18" height="18" fill="currentColor" aria-hidden="true">
    <path d="M165.9 397.4c0 2-2.3 3.6-5.2 3.6-3.3.3-5.6-1.3-5.6-3.6 0-2 2.3-3.6 5.2-3.6 3-.3 5.6 1.3 5.6 3.6zm-31.1-4.5c-.7 2 1.3 4.3 4.3 4.9 2.6 1 5.6 0 6.2-2s-1.3-4.3-4.3-5.2c-2.6-.7-5.5.3-6.2 2.3zm44.2-1.7c-2.9.7-4.9 2.6-4.6 4.9.3 2 2.9 3.3 5.9 2.6 2.9-.7 4.9-2.6 4.6-4.6-.3-1.9-3-3.2-5.9-2.9zM244.8 8C106.1 8 0 113.3 0 252c0 110.9 69.8 205.8 169.5 239.2 12.8 2.3 17.3-5.6 17.3-12.1 0-6.2-.3-40.4-.3-61.4 0 0-70 15-84.7-29.8 0 0-11.4-29.1-27.8-36.6 0 0-22.9-15.7 1.6-15.4 0 0 24.9 2 38.6 25.8 21.9 38.6 58.6 27.5 72.9 20.9 2.3-16 8.8-27.1 16-33.7-55.9-6.2-112.3-14.3-112.3-110.5 0-27.5 7.6-41.3 23.6-58.9-2.6-6.5-11.1-33.3 2.6-67.9 20.9-6.5 69 27 69 27 20-5.6 41.5-8.5 62.8-8.5s42.8 2.9 62.8 8.5c0 0 48.1-33.6 69-27 13.7 34.7 5.2 61.4 2.6 67.9 16 17.7 25.8 31.5 25.8 58.9 0 96.5-58.9 104.2-114.8 110.5 9.2 7.9 17 22.9 17 46.4 0 33.7-.3 75.4-.3 83.6 0 6.5 4.6 14.4 17.3 12.1C428.2 457.8 496 362.9 496 252 496 113.3 383.5 8 244.8 8zM97.2 352.9c-1.3 1-1 3.3.7 5.2 1.6 1.6 3.9 2.3 5.2 1 1.3-1 1-3.3-.7-5.2-1.6-1.6-3.9-2.3-5.2-1zm-10.8-8.1c-.7 1.3.3 2.9 2.3 3.9 1.6 1 3.6.7 4.3-.7.7-1.3-.3-2.9-2.3-3.9-2-.6-3.6-.3-4.3.7zm32.4 35.6c-1.6 1.3-1 4.3 1.3 6.2 2.3 2.3 5.2 2.6 6.5 1 1.3-1.3.7-4.3-1.3-6.2-2.2-2.3-5.2-2.6-6.5-1zm-11.4-14.7c-1.6 1-1.6 3.6 0 5.9 1.6 2.3 4.3 3.3 5.6 2.3 1.6-1.3 1.6-3.9 0-6.2-1.4-2.3-4-3.3-5.6-2.3z"/>
  </svg>
</a>

<script>
const main = document.getElementById("main");
const tip = document.getElementById("tip");
const q = document.getElementById("q");

// One read of the page is one nav token, and only the newest may paint. Every
// navigation takes a new token; a response that arrives after the user has
// moved on checks it and drops itself instead of painting over whatever page
// they are now on. Without it a slow /api/summary would land after a tx
// lookup and replace the tx page with the homepage, and a second summary()
// would bolt a second "Latest Blocks" card onto the first.
let navToken = 0;
function nav() { return ++navToken; }
function stale(token) { return token !== navToken; }

// Every API read goes through here rather than a bare fetch(). A non-2xx
// answer is an error, not data: the server answers 503 {"error":"busy"} when
// the connection pool stays exhausted and 500 on a database error, and
// neither payload has any of the fields the renderers below read -- handing
// one to a renderer is how a busy pool came out as "Nothing found.", or as an
// uncaught "txs.map is not a function" that left the page on "looking up…".
async function api(path) {
  const r = await fetch(path);
  let body = null;
  try { body = await r.json(); } catch { }
  if (!r.ok) {
    const e = new Error((body && body.error) || (r.status + " " + r.statusText));
    e.status = r.status;
    throw e;
  }
  return body;
}

function failed(e) {
  // The server answers a database error with a fixed string on purpose -- the
  // detail names tables and columns, which is not the caller's to read -- so
  // point at the log, which is where it went.
  main.innerHTML = `<div class="card"><b>Request failed.</b>
    <p>${esc(String((e && e.message) || e))}</p>
    <p style="color:#888;font-size:12px">The server log has the detail.</p></div>`;
}

function render(o, token) {
  if (token !== undefined && stale(token)) return;
  // Dispatch on the payload's shape, not on o.tip being non-null: a fresh
  // database returns {"tip": null}, which is a valid summary of an empty chain
  // and must not fall through to "Nothing found.".
  if (o && "tip" in o) {
    if (o.tip) tip.textContent = "height " + o.tip.height;
    else tip.textContent = "no blocks indexed";
    return summary(o, token);
  }
  if (o && o.script_hash) return script(o);
  if (o && o.address && o.confirmed) return address(o);
  if (o && o.hash && o.txs) return block(o);
  if (o && o.vin)  return tx(o);
  main.innerHTML = '<div class="card"><b>Nothing found.</b></div>';
}

function summary(o, token) {
  // tip === null means the database is empty: no blocks indexed yet. Counts
  // are absent from the payload in that case too, so don't render the table.
  if (!o.tip) {
    main.innerHTML = `
    <div class="card">
      <h2>No blocks indexed</h2>
      <p>This chain database is empty. Start the indexer to populate it, then
         reload — <code>indexer.py</code> syncs from the daemon's tip.</p>
    </div>`;
    return;
  }
  main.innerHTML = `
  <div class="card">
    <h2>Tip <span class="badge">height ${esc(o.tip.height)}</span></h2>
    <div class="mono">${esc(o.tip.hash)}</div>
    <p>${o.tip.time ? new Date(o.tip.time*1000).toISOString() : ""}</p>
    <table>
      <tr><th>block</th><th>txs in block</th><th>txs in chain</th><th>mempool</th><th>difficulty</th><th>total coinbase</th></tr>
      <tr><td><a href="#" data-b="tip">#${esc(o.tip.height)}</a></td>
          <td>${esc(o.n_txs_tip)}</td>
          <td>${esc(o.n_txs)}</td>
          <td><a href="#" data-t="mempool">${esc(o.n_mempool)}</a></td>
          <td>${esc(o.tip.difficulty)}</td>
          <td><b>${esc(o.total_coinbase_pxc)} PXC</b></td></tr>
    </table>
  </div>`;
  main.querySelector("a[data-t]").onclick = e => {
    e.preventDefault();
    go("mempool");
  };
  main.querySelectorAll("a[data-b=tip]").forEach(a =>
    a.onclick = e => { e.preventDefault(); go(String(o.tip.height)); });
  // Appended to the summary page rather than replacing it, so it is the one
  // render that has to check the token itself: the gap between the innerHTML
  // above and this response is several queries wide, which is long enough for
  // the user to have navigated somewhere else.
  api("/api/recent_blocks").then(blocks => renderRecentBlocks(blocks, token))
    .catch(e => { if (!stale(token)) failed(e); });
}

function renderRecentBlocks(blocks, token) {
  if (token !== undefined && stale(token)) return;
  if (!Array.isArray(blocks)) {
    failed(new Error("unexpected /api/recent_blocks payload"));
    return;
  }
  const rows = blocks.map(b => `
    <tr><td><a href="#" data-h="${esc(b.height)}">${esc(b.height)}</a></td>
        <td>${esc(b.n_txs)}</td>
        <td class="mono">${esc(b.hash)}</td>
        <td>${b.time ? new Date(b.time*1000).toISOString() : ""}</td></tr>`).join("");
  main.insertAdjacentHTML("beforeend", `
  <div class="card"><h2>Latest Blocks</h2>
    <table><tr><th>height</th><th>txs</th><th>hash</th><th>time</th></tr>
      ${rows}</table>
  </div>`);
  main.querySelectorAll("a[data-h]").forEach(a =>
    a.onclick = e => { e.preventDefault(); go(a.dataset.h); });
}

function mempool(txs) {
  main.innerHTML = `<div class="card"><h2>Mempool (${esc(txs.length)})</h2>
    ${txs.map(t => `<div class="mono"><a href="#" data-tx="${esc(t)}">${esc(t)}</a></div>`).join("")}
  </div>`;
  main.querySelectorAll("a[data-tx]").forEach(a =>
    a.onclick = e => { e.preventDefault(); go(a.dataset.tx); });
}

async function fetchMempool() {
  const token = nav();
  main.innerHTML = '<div class="card">looking up…</div>';
  try {
    const txs = await api("/api/mempool");
    if (stale(token)) return;
    if (!Array.isArray(txs)) throw new Error("unexpected /api/mempool payload");
    mempool(txs);
  } catch (e) {
    if (!stale(token)) failed(e);
  }
}

function go(param) {
  q.value = param;
  const target = "#" + encodeURIComponent(param);
  if (location.hash === target) {
    fetchHint(param);
  } else {
    location.hash = target;
  }
}

async function fetchHint(param) {
  if (param === "mempool") return fetchMempool();
  // One token for the whole lookup, checked before every render: this walks up
  // to five endpoints in sequence, so the page it answers for is often several
  // navigations old by the time the last one comes back.
  const token = nav();
  main.innerHTML = '<div class="card">looking up…</div>';
  // The 404s are the normal path through a multi-lookup, so they fall through
  // to the next shape rather than throwing; only a real failure (a busy pool, a
  // database error, a dead server) breaks the walk, and that is what has to
  // replace "looking up…" instead of leaving it there for good.
  const isNum = /^\d+$/.test(param);
  const attempts = [];
  if (isNum) attempts.push("/api/block/" + param);
  if (/^[0-9a-f]{40}$/i.test(param)) attempts.push("/api/script/" + param);
  if (!isNum) attempts.push("/api/block/" + param);
  attempts.push("/api/tx/" + param, "/api/address/" + param);
  let hard = null;
  for (const path of attempts) {
    let r;
    try {
      r = await api(path);
    } catch (e) {
      if (e.status === 404) continue;
      hard = e;
      break;
    }
    if (stale(token)) return;
    render(r, token);
    return;
  }
  if (stale(token)) return;
  if (hard) failed(hard);
  else main.innerHTML = '<div class="card"><b>Nothing found.</b></div>';
}

function fmtSize(s) {
  if (s === null || s === undefined) return "—";
  return s + " B";
}

// Genesis has no previous block and the tip has no next one, so there is
// nothing to look up for either. Emitting the dash as a link anyway made the
// `if (pb)` guards below dead code and sent "—" through the whole lookup.
function hashOrDash(hash, which) {
  return hash ? `<a href="#" data-b="${which}">${esc(hash)}</a>` : "—";
}

function block(b) {
  const rows = b.txs.map(t => `
    <tr><td>${esc(t.index)}</td>
        <td><a href="#" data-tx="${esc(t.txid)}" class="mono">${esc(t.txid)}</a></td>
        <td>${t.coinbase ? '<span class="badge">coinbase</span>' : ""}</td></tr>`).join("");
  main.innerHTML = `
  <div class="card">
    <h2>Block <span class="badge">${esc(b.height)}</span></h2>
    <div class="mono">${esc(b.hash)}</div>
    <table>
      <tr><th>time</th><td>${new Date(b.time*1000).toISOString()}</td></tr>
      <tr><th>txs</th><td>${esc(b.txs.length)}</td></tr>
      <tr><th>size</th><td>${fmtSize(b.size)}</td></tr>
      <tr><th>difficulty</th><td>${esc(b.difficulty)}</td></tr>
      <tr><th>total coinbase</th><td><b>${esc(b.total_coinbase_pxc)} PXC</b></td></tr>
      <tr><th>nonce</th><td>${esc(b.nonce)}</td></tr>
      <tr><th>bits</th><td>${esc(b.bits)}</td></tr>
      <tr><th>merkleroot</th><td class="mono">${esc(b.merkleroot)}</td></tr>
      <tr><th>prev</th><td class="mono">${hashOrDash(b.prev_hash, "prev")}</td></tr>
      <tr><th>next</th><td class="mono">${hashOrDash(b.next_hash, "next")}</td></tr>
    </table>
  </div>
  <div class="card"><h2>Transactions</h2>
    <table><tr><th>#</th><th>txid</th><th></th></tr>${rows}</table>
  </div>`;
  main.querySelectorAll("a[data-tx]").forEach(a =>
    a.onclick = e => { e.preventDefault(); go(a.dataset.tx); });
  const pb = main.querySelector("a[data-b=prev]");
  if (pb) pb.onclick = e => { e.preventDefault(); go(pb.textContent); };
  const nb = main.querySelector("a[data-b=next]");
  if (nb) nb.onclick = e => { e.preventDefault(); go(nb.textContent); };
}

function esc(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function addrLink(a) {
  a = esc(a);
  return `<a href="#" data-a="${a}">${a}</a>`;
}

function plural(n, word) {
  return `${esc(n)} ${word}${n === 1 ? "" : "s"}`;
}

// Ellipsis only when the slice actually cut something: the old form appended
// one unconditionally, so every script hex ended in "…" whether or not it had
// been truncated, and a script with no hex rendered as a bare "…".
function clip(s, max) {
  return s.length > max ? s.slice(0, max) + "…" : s;
}

function heightLink(h) {
  // Null height: this script has only ever been seen unconfirmed, so there is
  // no block to link to (a sentinel height like 2147483648 would be a lie).
  if (h === null || h === undefined) return "mempool";
  return `#<a href="#" data-b="h">${esc(h)}</a>`;
}

function tx(t) {
  const ins = t.vin.map(v =>
    v.coinbase ? `<tr><td>coinbase: <span class="mono">${esc(v.coinbase)}</span></td></tr>`
    : `<tr><td class="mono"><a href="#" data-tx="${esc(v.prev_txid)}">${esc(v.prev_txid)}</a>:${esc(v.prev_vout)}</td></tr>`).join("");
  const outs = t.vout.map(v => `
    <tr><td>${esc(v.value_hex)}</td>
        <td><span class="badge ${v.type.includes("hybrid") ? "hybrid" : ""}">${esc(v.type)}</span></td>
        <td>${(v.addresses || []).map(addrLink).join(", ") || "—"}</td>
        <td class="mono">${v.script_hash ? `<span class="badge">script</span> <a href="#" data-sh="${esc(v.script_hash)}" class="scripthash">${esc(v.script_hash.slice(0, 16))}…</a><br>` : ""}${esc(clip((v.script_hex || "").slice(0, 120), 120))}</td>
    </tr>`).join("");
  const kind = t.is_coinbase ? '<span class="badge">coinbase</span>'
             : (t.status === "mempool" ? '<span class="badge">mempool</span>'
             : (t.status === "orphaned" ? '<span class="badge" style="background:#c60">orphaned</span>'
             : ""));
  let blockrow = t.height !== null
      ? `<tr><th>block</th><td><a href="#" data-b="h">${esc(t.height)}</a></td></tr>` : "";
  main.innerHTML = `
  <div class="card">
    <h2>Transaction ${kind}</h2>
    <div class="mono">${esc(t.txid)}</div>
    <table>
      <tr><th>version</th><td>${esc(t.version)}</td></tr>
      <tr><th>locktime</th><td>${esc(t.locktime)}</td></tr>
      <tr><th>size</th><td>${fmtSize(t.size)}</td></tr>
      ${blockrow}
    </table>
  </div>
  <div class="card"><h2>Inputs</h2>
    <table>${ins}</table>
  </div>
  <div class="card"><h2>Outputs</h2>
    <table><tr><th>value</th><th>type</th><th>address</th><th>script</th></tr>
      ${outs}</table>
  </div>`;
  main.querySelectorAll("a[data-tx]").forEach(a =>
    a.onclick = e => { e.preventDefault(); go(a.dataset.tx); });
  main.querySelectorAll("a[data-a]").forEach(a =>
    a.onclick = e => { e.preventDefault(); go(a.dataset.a); });
  main.querySelectorAll("a[data-sh]").forEach(a =>
    a.onclick = e => { e.preventDefault(); go(a.dataset.sh); });
  const bb = main.querySelector("a[data-b=h]");
  if (bb) bb.onclick = e => { e.preventDefault(); go(bb.textContent); };
}

function address(a) {
  const rows = a.outputs.map(o => `
    <tr><td><a href="#" data-tx="${esc(o.txid)}">${esc(o.txid)}</a></td>
        <td>${esc(o.n)}</td>
        <td>${esc(o.value_hex)}</td>
        <td><span class="badge ${o.type.includes("hybrid") ? "hybrid" : ""}">${esc(o.type)}</span></td>
        <td>${o.spent
              ? (o.spent_confirmed
                  ? '<span class="badge spent">spent</span>'
                  : '<span class="badge" style="background:#a60">spent (mempool)</span>')
              : '<span class="badge" style="background:#080">unspent</span>'}</td>
    </tr>`).join("");
  const trows = a.txs.map(t =>
    `<tr><td class="mono"><a href="#" data-tx="${esc(t)}">${esc(t)}</a></td></tr>`).join("");
  const notice = a.outputs_truncated
    ? `<p class="card" style="padding:10px 16px;color:#c60;font-size:12px">Showing the first
       ${esc(a.outputs.length)} of ${esc(a.n_outputs)} outputs (balances are still accurate).</p>` : "";
  // n_txs is the address's real count; a.txs is the same list capped at the
  // server's 2000-row limit, so a.txs.length reports 2000 for an address with
  // any history past that. Show the count, and say so when it is a slice.
  const txNotice = a.txs_truncated
    ? `<p style="color:#c60;font-size:12px;margin:4px 16px 0">Showing the first
       ${esc(a.txs.length)} of ${esc(a.n_txs)} transactions.</p>` : "";
  main.innerHTML = `
  <div class="card">
    <h2>Address</h2>
    <div class="mono">${esc(a.address)}</div>
    <table>
      <tr><th>confirmed balance</th><td><b>${esc(a.confirmed.balance_hex)}</b> PXC</td></tr>
      <tr><th>received</th><td>${esc(a.confirmed.value_received_hex)} PXC (${plural(a.confirmed.n_outputs, "output")})</td></tr>
      <tr><th>spent</th><td>${esc(a.confirmed.value_spent_hex)} PXC</td></tr>
      <tr><th>live balance <span class="badge">incl. mempool</span></th>
          <td><b>${esc(a.live.balance_hex)}</b> PXC</td></tr>
      <tr><th>received</th><td>${esc(a.live.value_received_hex)} PXC (${plural(a.live.n_outputs, "output")})</td></tr>
      <tr><th>spent</th><td>${esc(a.live.value_spent_hex)} PXC</td></tr>
      <tr><th>txs</th><td>${esc(a.n_txs)}</td></tr>
    </table>
  </div>
  ${notice}
  <div class="card"><h2>Outputs</h2>
    <table><tr><th>txid</th><th>vout</th><th>value</th><th>type</th><th>status</th></tr>
      ${rows}</table>
  </div>
  <div class="card"><h2>Transactions</h2>
    <table>${trows}</table>
    ${txNotice}
  </div>`;
  main.querySelectorAll("a[data-tx]").forEach(a =>
    a.onclick = e => { e.preventDefault(); go(a.dataset.tx); });
}

function script(s) {
  const owners = (s.addresses || []).map(addrLink).join(", ") || "—";
  const bal = (b, label) => `
      <tr><th>${label}</th><td><b>${esc(b.balance_hex)}</b> PXC</td></tr>
      <tr><th>received</th><td>${esc(b.value_received_hex)} PXC (${plural(b.n_vout, "output")})</td></tr>
      <tr><th>spent</th><td>${esc(b.value_spent_hex)} PXC (${plural(b.n_spent, "output")})</td></tr>`;
  const differs = s.confirmed.balance !== s.live.balance;
  const delta = ((s.live.balance - s.confirmed.balance) / 1e8).toFixed(8);
  const sign = s.live.balance > s.confirmed.balance ? "+" : "";
  main.innerHTML = `
  <div class="card">
    <h2>Script <span class="badge">${esc(s.type)}</span></h2>
    <div class="mono">${esc(s.script_hash)}</div>
    <table>
      <tr><th>owners (participants)</th><td>${owners}</td></tr>
      <tr><th>required sigs</th><td>${esc(s.req_sigs)}</td></tr>
      ${bal(s.confirmed, "confirmed balance")}
      ${bal(s.live, "live balance <span class=\"badge\">incl. mempool</span>")}
      <tr><th>first seen</th><td>${heightLink(s.created_height)}</td></tr>
      <tr><th>last seen</th><td>${heightLink(s.last_height)}</td></tr>
    </table>
    ${differs ? `<p style="color:#c60;font-size:12px;margin:8px 16px">
      Unconfirmed transactions move the balance by ${sign}${esc(delta)} PXC.
      A mempool spend can still be replaced, so the confirmed figure is the
      one that cannot be taken away.</p>` : ""}
  </div>`;
  main.querySelectorAll("a[data-a]").forEach(a =>
    a.onclick = e => { e.preventDefault(); go(a.dataset.a); });
  main.querySelectorAll("a[data-b=h]").forEach(a =>
    a.onclick = e => { e.preventDefault(); go(a.textContent); });
}

q.addEventListener("keydown", e => { if (e.key === "Enter" && q.value) go(q.value); });
document.querySelector("a[data-home]").onclick = e => {
  e.preventDefault();
  q.value = "";
  if (location.hash) {
    history.pushState("", "", location.pathname);
  }
  route();
};

function route() {
  const h = location.hash.slice(1);
  if (!h) {
    const token = nav();
    main.innerHTML = '<div class="card">loading…</div>';
    // Errors included: a bare fetch().then(r => r.json()) fed the 503
    // {"error":"busy"} payload to render(), which matched none of its shapes
    // and reported "Nothing found." on a healthy, fully indexed chain.
    api("/api/summary")
      .then(o => render(o, token))
      .catch(e => { if (!stale(token)) failed(e); });
  } else {
    try { go(decodeURIComponent(h)); }
    catch { go(h); }
  }
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
